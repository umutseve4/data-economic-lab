name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECOLAB_SOURCE: sample
      ECOLAB_LOG_LEVEL: WARNING
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert no secret is committed
        run: |
          # A committed .env is always a failure.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"; exit 1
          fi
          # An assigned key value that is not the documented placeholder is a failure.
          if grep -rIn --exclude-dir=.git --exclude-dir=reports --exclude=README.md \
               -E 'EVDS_API_KEY=[A-Za-z0-9]{8,}' . \
             | grep -v 'your_evds_api_key_here'; then
            echo "::error::a literal EVDS_API_KEY value appears in the tree"; exit 1
          fi
          echo "no committed secret found"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Record toolchain versions
        run: |
          {
            echo "### Toolchain"
            echo '```text'
            python --version
            ruff --version
            mypy --version
            pytest --version
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Every gate runs, every gate's full output is written to the job summary,
      # and the step fails once at the end if any gate failed. See ci/gates.sh.
      - name: Quality gates
        run: bash ci/gates.sh

      - name: Upload report and figures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: reports
          path: reports/
          if-no-files-found: warn
