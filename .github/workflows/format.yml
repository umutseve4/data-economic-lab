name: format

# Manual only. Run this from the GitHub UI (Actions -> format -> Run workflow)
# when `ci` fails on the "Ruff format check" step and you have no local Python
# environment. It applies `ruff format` plus ruff's *safe* lint fixes and
# commits the result to main.
#
# Note: a push made with GITHUB_TOKEN does not re-trigger `ci`. After this
# workflow commits, start `ci` manually (Actions -> ci -> Run workflow).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Record ruff version
        run: |
          {
            echo "### Ruff"
            echo '```'
            ruff --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply ruff format and safe lint fixes
        run: |
          ruff format .
          ruff check --fix .

      - name: Show what changed
        run: |
          {
            echo "### Diff"
            echo '```diff'
            git --no-pager diff || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to fix: the tree already matches ruff." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply ruff format and safe lint fixes"
          git push origin HEAD:main
          echo "Committed ruff fixes. Now run \`ci\` manually." \
            >> "$GITHUB_STEP_SUMMARY"
